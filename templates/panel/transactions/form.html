{% extends "panel/base.html" %}
{% block title %}{% if transaction %}Edit Transaction{% else %}New Transaction{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
  <h2>{% if transaction %}Edit Transaction{% else %}New Transaction{% endif %}</h2>
</div>

<div class="card dashboard-card" style="max-width:640px">
  <div class="card-body panel-form">
    <form method="post">
      {% csrf_token %}
      <label>Type</label>
      <select name="transaction_type" required>
        {% for code, label in type_choices %}
        <option value="{{ code }}" {% if transaction.transaction_type == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>

      <div style="display:flex; gap:16px; flex-wrap:wrap">
        <div style="flex:1 1 200px">
          <label>Amount ($)</label>
          <input type="number" name="amount" step="0.01" value="{{ transaction.amount|default_if_none:'' }}" required>
        </div>
        <div style="flex:1 1 200px">
          <label>Date</label>
          <input type="date" name="date" value="{{ transaction.date|date:'Y-m-d' }}" required>
        </div>
      </div>

      <label>Payment Method</label>
      <select name="payment_method">
        <option value="">— None —</option>
        {% for code, label in method_choices %}
        <option value="{{ code }}" {% if transaction.payment_method == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>

      <label>Category (e.g. Materials, Labor, Fuel)</label>
      <input type="text" name="category" value="{{ transaction.category|default:'' }}">

      <label>Project (optional)</label>
      <select name="project">
        <option value="">— None —</option>
        {% for p in projects %}
        <option value="{{ p.pk }}" {% if transaction.project_id == p.pk or preset_project == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }} — {{ p.customer }}</option>
        {% endfor %}
      </select>

      <label>Customer (optional)</label>
      <select name="customer">
        <option value="">— None —</option>
        {% for c in customers %}
        <option value="{{ c.pk }}" {% if transaction.customer_id == c.pk %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>

      <label>Payee / Vendor (for expenses without a customer)</label>
      <input type="text" name="payee" value="{{ transaction.payee|default:'' }}" placeholder="e.g. Home Depot">

      <label>Invoice (optional)</label>
      <select name="invoice">
        <option value="">— None —</option>
        {% for inv in invoices %}
        <option value="{{ inv.pk }}" {% if transaction.invoice_id == inv.pk %}selected{% endif %}>{{ inv.invoice_number }} — {{ inv.customer }}</option>
        {% endfor %}
      </select>

      <label>Memo / Description</label>
      <input type="text" name="description" value="{{ transaction.description|default:'' }}">

      <button type="submit" class="btn-panel">{% if transaction %}Save Changes{% else %}Create Transaction{% endif %}</button>
      <a href="{% url 'panel:transaction_list' %}" class="btn-panel-outline" style="margin-left:8px">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
