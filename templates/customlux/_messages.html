{% if messages %}
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% elif m.tags == 'success' %}success{% else %}info{% endif %}"
         style="padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px;
                background:{% if m.tags == 'error' %}#fef2f2{% elif m.tags == 'success' %}#f0fdf4{% else %}#eff6ff{% endif %};
                color:{% if m.tags == 'error' %}#991b1b{% elif m.tags == 'success' %}#065f46{% else %}#1e40af{% endif %};
                border:1px solid {% if m.tags == 'error' %}#fecaca{% elif m.tags == 'success' %}#bbf7d0{% else %}#bfdbfe{% endif %}">
      {{ m }}
    </div>
  {% endfor %}
{% endif %}
